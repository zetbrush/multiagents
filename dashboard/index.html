<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>multiagents control center</title>
  <script>
    // Apply the theme before first paint (system / light / dark, chosen in the top bar)
    (function () {
      var pref = "system";
      try { pref = localStorage.getItem("ma-theme") || "system"; } catch (e) {}
      var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app-bg" aria-hidden="true"></div>
  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn only-narrow" id="left-drawer-btn" title="Sessions and files">&#9776;</button>
        <div class="brand"><span class="brand-mark">M</span><span>multiagents</span></div>
        <button class="session-switch" id="session-name" title="Switch session"><span class="dot" id="conn-dot"></span><span id="session-name-text">connecting…</span><span>&#9662;</span></button>
        <span id="session-status-badge" class="badge hidden"></span>
      </div>
      <div class="topbar-right">
        <span class="topbar-stat" id="agent-count"></span>
        <span class="topbar-stat" id="uptime"></span>
        <span class="plan-meter" id="plan-meter" title="Plan limits" hidden></span>
        <span class="pill" id="broker-pill" title="Broker status"><span class="dot" id="broker-dot"></span><span id="broker-label">Broker</span></span>
        <span class="topbar-stat" id="ws-status"></span>
        <button class="icon-btn lang-btn" id="lang-btn" title="Language">EN</button>
        <button class="icon-btn" id="appearance-btn" title="Appearance"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><circle cx="5.5" cy="6.5" r="1.3"/><path d="M1.8 12l3.7-3.4 2.6 2.3 2.4-2 3.7 3.3"/></svg></button>
        <button class="icon-btn" id="theme-btn" title="Theme"></button>
        <button class="icon-btn" id="left-toggle" title="Toggle sidebar (Ctrl+B)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button>
        <button class="icon-btn" id="right-toggle" title="Toggle preview (Ctrl+J)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></svg></button>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <!-- Left: sessions + explorer -->
      <aside class="pane left" id="left-pane">
        <section class="side-section" id="sessions-section">
          <div class="side-header">
            <span class="title" data-collapse="sessions-section"><span class="chev">&#9662;</span>Sessions</span>
            <button class="icon-btn" data-action="new-team" title="New team">&#43;</button>
            <button class="icon-btn" data-action="new-session" title="New empty session"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M8 6v4M6 8h4"/></svg></button>
          </div>
          <div class="side-body" id="sidebar-list"></div>
        </section>
        <section class="side-section grow" id="explorer-section">
          <div class="side-header">
            <span class="title" data-collapse="explorer-section"><span class="chev">&#9662;</span>Explorer <span class="sub" id="explorer-root"></span></span>
            <button class="icon-btn" id="explorer-refresh" title="Refresh"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg></button>
            <button class="icon-btn" id="explorer-collapse" title="Collapse folders"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 6l4-3 4 3M4 13l4-3 4 3"/></svg></button>
          </div>
          <div class="side-body tree" id="explorer-tree"></div>
        </section>
      </aside>
      <div class="resizer" data-resize="left"></div>

      <!-- Center: session + chat -->
      <main class="pane center">
        <div class="session-bar" id="session-bar">
          <div class="session-info">
            <div class="session-title"><span id="sb-name">No session</span><span id="sb-status"></span><span id="sb-gate"></span></div>
            <div class="session-meta" id="sb-meta"></div>
          </div>
          <div class="toolbar" id="session-toolbar">
            <button class="btn warn" data-action="session-pause">&#10074;&#10074; Pause</button>
            <button class="btn success" data-action="session-resume">&#9654; Resume</button>
            <button class="btn" data-action="toggle-qa" id="qa-btn" title="Hold the team's work and ask agents questions one at a time">&#9995; Q&amp;A mode</button>
            <button class="btn" data-action="add-agent">+ Add Agent</button>
            <button class="btn" data-action="release-menu">Release &#9662;</button>
            <button class="btn" data-action="session-menu">More &#9662;</button>
          </div>
        </div>
        <div id="gate-banner" class="hidden"></div>
        <div id="qa-banner" class="hidden"></div>
        <div id="broker-banner" class="hidden"></div>
        <div id="approval-banner" class="hidden"></div>

        <div class="tabs" id="tab-bar">
          <div class="tab active" data-tab="chat">Chat <span class="tab-badge" id="badge-chat">0</span></div>
          <div class="tab" data-tab="activity">Activity <span class="tab-badge" id="badge-activity"></span></div>
          <div class="tab" data-tab="agents">Agents <span class="tab-badge" id="badge-agents">0</span></div>
          <div class="tab" data-tab="plan">Plan <span class="tab-badge" id="badge-plan">-</span></div>
          <div class="tab" data-tab="knowledge">Knowledge <span class="tab-badge" id="badge-knowledge">0</span></div>
          <div class="tab" data-tab="files">Locks <span class="tab-badge" id="badge-files">0</span></div>
          <div class="tab" data-tab="stats">Usage <span class="tab-badge" id="badge-stats"></span></div>
        </div>

        <!-- Chat -->
        <div class="view chat-view" id="panel-chat">
          <div class="chat-toolbar">
            <label class="checkbox" style="align-items:center"><input type="checkbox" id="msg-show-system"> system messages</label>
            <select id="msg-filter-agent"><option value="">everyone</option></select>
            <span class="spacer"></span>
            <span id="chat-count"></span>
          </div>
          <div class="chat-scroll" id="msg-feed"></div>
          <button class="jump-new hidden" id="jump-new">New messages &#8595;</button>
          <div class="composer">
            <div class="composer-box">
              <div class="composer-top">
                <span>To</span>
                <select id="composer-to"></select>
                <span id="composer-target-hint"></span>
                <label class="composer-interrupt" id="composer-interrupt-wrap" title="Stop what this agent is doing so it answers you first"><input type="checkbox" id="composer-interrupt"><span>Interrupt</span></label>
                <span style="flex:1"></span>
                <button class="btn ghost small" id="composer-presets" title="Quick messages">&#9889; Quick</button>
              </div>
              <div class="composer-row">
                <textarea id="composer-text" rows="1" placeholder="Message the team… (Enter to send, Shift+Enter for a new line)"></textarea>
                <button class="send-btn" id="composer-send" title="Send"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.7 1.6a.6.6 0 0 1 .7-.1l12 6a.6.6 0 0 1 0 1.1l-12 6a.6.6 0 0 1-.8-.7L3.2 8.5H8a.5.5 0 0 0 0-1H3.2L1.6 2.2a.6.6 0 0 1 .1-.6z"/></svg></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Activity: what each agent is doing, step by step -->
        <div class="view chat-view hidden" id="panel-activity">
          <div class="chat-toolbar">
            <select id="act-agent"><option value="">all agents</option></select>
            <label class="checkbox" style="align-items:center"><input type="checkbox" id="act-team"> team messages</label>
            <label class="checkbox" style="align-items:center"><input type="checkbox" id="act-thinking" checked> thinking</label>
            <span class="spacer"></span>
            <span id="act-count" class="muted"></span>
            <button class="btn small" id="act-settings" title="Model, approvals and limits of the selected agent">Agent settings</button>
          </div>
          <div id="act-approvals"></div>
          <div class="chat-scroll act-scroll" id="act-feed"></div>
          <button class="jump-new hidden" id="act-jump" style="bottom:24px">Newest steps &#8595;</button>
        </div>

        <div class="view hidden" id="panel-agents"></div>

        <div class="view hidden" id="panel-plan">
          <div class="card">
            <div class="card-header"><span>Add task</span></div>
            <div class="card-body">
              <form class="form-inline" id="plan-add-form">
                <input type="text" id="plan-add-label" placeholder="Task description" required>
                <select id="plan-add-assignee"></select>
                <button class="btn primary" type="submit">Add</button>
              </form>
            </div>
          </div>
          <div id="plan-list"></div>
        </div>

        <div class="view hidden" id="panel-knowledge">
          <div class="card">
            <div class="card-header"><span id="knowledge-form-title">Add knowledge</span></div>
            <div class="card-body">
              <form id="knowledge-form" class="form-grid">
                <label for="kn-key">Key</label>
                <input type="text" id="kn-key" placeholder="e.g. api-auth-scheme" required>
                <label for="kn-category">Category</label>
                <select id="kn-category">
                  <option value="decision">decision</option>
                  <option value="convention">convention</option>
                  <option value="discovery">discovery</option>
                  <option value="blocker">blocker</option>
                  <option value="context" selected>context</option>
                </select>
                <label for="kn-value">Value</label>
                <textarea id="kn-value" rows="3" required></textarea>
                <div style="grid-column:1/-1" class="flex gap-2"><span style="flex:1"></span>
                  <button class="btn" type="button" id="kn-cancel">Clear</button>
                  <button class="btn primary" type="submit">Save</button>
                </div>
              </form>
            </div>
          </div>
          <div id="knowledge-list"></div>
        </div>

        <div class="view hidden" id="panel-files">
          <div id="files-list"></div>
          <div class="card">
            <div class="card-header"><span>Reserve a file for an agent</span></div>
            <div class="card-body">
              <form class="form-inline" id="lock-form">
                <select id="lock-agent"></select>
                <input type="text" id="lock-path" placeholder="path/relative/to/project.ts" required>
                <input type="number" id="lock-minutes" value="10" min="1" style="width:80px" title="minutes">
                <span class="dim" style="font-size:12px">min</span>
                <input type="text" id="lock-purpose" placeholder="purpose (optional)">
                <button class="btn primary" type="submit">Acquire lock</button>
              </form>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><span>Assign ownership zone</span></div>
            <div class="card-body">
              <form class="form-inline" id="ownership-form">
                <select id="own-agent"></select>
                <input type="text" id="own-patterns" placeholder="src/api/**, docs/*.md" required>
                <button class="btn primary" type="submit">Assign</button>
              </form>
              <div class="field-hint" style="margin-top:6px">Comma-separated glob patterns. Other agents are denied locks inside the zone.</div>
            </div>
          </div>
        </div>

        <div class="view hidden" id="panel-stats"></div>
      </main>
      <div class="resizer" data-resize="right"></div>

      <!-- Right: preview + team -->
      <aside class="pane right" id="right-pane">
        <div class="right-tabs" id="right-tabs">
          <div class="tab active" data-rtab="preview">Preview</div>
          <div class="tab" data-rtab="team">Team <span class="tab-badge" id="badge-team">0</span></div>
          <span class="spacer"></span>
          <button class="icon-btn only-narrow" id="right-close" title="Close">&#10005;</button>
        </div>
        <div id="rpanel-preview" style="display:flex;flex-direction:column;flex:1;min-height:0">
          <div class="preview-head hidden" id="preview-head">
            <span class="preview-path" id="preview-path"></span>
            <span id="preview-mode"></span>
            <button class="icon-btn" id="preview-reload" title="Reload"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg></button>
            <button class="icon-btn" id="preview-mention" title="Mention in chat">@</button>
            <a class="icon-btn" id="preview-open" target="_blank" rel="noopener" title="Open in new tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2.5h4.5V7M13.5 2.5L7 9M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg></a>
            <a class="icon-btn" id="preview-download" title="Download"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2v8.5M4.5 7L8 10.5 11.5 7M2.5 13.5h11"/></svg></a>
            <button class="icon-btn" id="preview-close" title="Close preview">&#10005;</button>
          </div>
          <div class="preview-body" id="preview-body"></div>
        </div>
        <div id="rpanel-team" class="hidden" style="flex:1;min-height:0;overflow-y:auto"></div>
      </aside>
    </div>
  </div>

  <div class="overlay" id="picker-overlay">
    <div class="picker">
      <input class="picker-search" id="picker-search" type="text" placeholder="Search sessions..." autocomplete="off" />
      <div class="picker-list" id="picker-list"></div>
    </div>
  </div>
  <div class="overlay" id="modal-overlay"></div>
  <div class="menu" id="menu"></div>
  <div class="toasts" id="toasts"></div>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
