name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run it by hand from the Actions tab (Run workflow) on any branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  # The publish job's toolchain and packaging, minus the publish itself (a dry-run
  # publish would refuse the already-published version on every branch)
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: |
          npm install -g npm@latest
          npm --version
      - run: npm pack --ignore-scripts
